[project]
name = "paperscout"
version = "0.1.0"
description = "Filesystem-first, evidence-grounded academic paper wiki and QA pipeline."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.2.0",
  "openai>=1.40.0",
  "pydantic>=2.7.0",
  "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paperscout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: uses the locally available MinerU paper fixture",
]
